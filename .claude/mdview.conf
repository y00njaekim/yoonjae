# mdview settings — everything tunable lives here.
# Edit a value, save, run mdview.sh again. No other file needs changing.

# --- type ---------------------------------------------------------------
# Body text size in px. Headings, code and tables scale from this.
MDVIEW_FONT=14

# Font stack. Try: '"Pretendard",sans-serif'  '"Apple SD Gothic Neo",sans-serif'
MDVIEW_SANS='"Helvetica Neue","Apple SD Gothic Neo",sans-serif'

# Letter spacing. More negative = tighter glyphs.
MDVIEW_TRACKING=-0.012em

# --- layout -------------------------------------------------------------
# Column width is derived from the pane: cols * SCALE, clamped to MIN/MAX.
MDVIEW_WIDTH_SCALE=9
MDVIEW_WIDTH_MIN=640
MDVIEW_WIDTH_MAX=1100

# --- colour -------------------------------------------------------------
MDVIEW_THEME=dark
