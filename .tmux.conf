# tpm: [GitHub - tmux-plugins/tpm: Tmux Plugin Manager · GitHub](https://github.com/tmux-plugins/tpm?tab=readme-ov-file#installation)
# yazi: [Yazi](https://yazi-rs.github.io/docs/installation/), ./.config/yazi/keymap.toml

set -g mouse on
set -g history-limit 50000
set -g base-index 1
set -g default-terminal "tmux-256color"
set -g extended-keys on
set -as terminal-features 'xterm-ghostty:extkeys'
set -g allow-rename off # do not allow auto-rename
set -g allow-passthrough on
set -g pane-border-format " #{pane_index} #{pane_current_command} "
set -g pane-border-status top
set -g pane-border-lines double
set-option -g renumber-windows on

set -sg escape-time 0
setw -g mode-keys vi

# bind vi keys
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection

# set prefix -> ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# select window with meta(opt)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# split window
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# resize pane, prefix+H/J/K/L (-r is repeatable option without prefix)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# navigate pane
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind ` last-pane

# navigate window
bind m previous-window

# close window
bind -n M-x kill-window

# tmux <-> system clipboard
set -s set-clipboard on

# prefix + r <- reload conf
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# plugin
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'

# gruvbox dark
set -g status-style "fg=#ebdbb2,bg=#282828"
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#a89984"
set -g message-style "fg=#282828,bg=#fe8019"
set -g message-command-style "fg=#282828,bg=#83a598"
setw -g mode-style "fg=#282828,bg=#b8bb26"

# layout
set -g status-left-length 40
set -g status-right-length 150
set -g status-left "#[fg=#ebdbb2,bg=#3c3836] #S #[default]"
set -g status-right "#[fg=#ebdbb2,bg=#3c3836] #{pane_current_path} #[default]"
set -ag status-right "#[fg=#b8bb26,bg=#3c3836] #(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null || echo '-') #[default]"
set -ag status-right "#[fg=#83a598,bg=#3c3836] #{cpu_percentage} #[default]"
set -ag status-right "#[fg=#fe8019,bg=#3c3836] #{ram_percentage} #[default]"
set -g window-status-style "fg=#7c6f64,bg=#282828"
set -g window-status-current-style "fg=#282828,bg=#a89984,bold"
set -g window-status-format " #I:#{=10:window_name} "
set -g window-status-current-format "#[bold] *#I:#W* "

# notification
set -g bell-action any    # bells from any window
set -g visual-bell off    # pass the bell through, don't intercept
set -g monitor-bell on    # flag belled windows in the status line

# yazi
bind Tab split-window -h -l 50% -c "#{pane_current_path}" "yazi"

# run tpm
run '~/.tmux/plugins/tpm/tpm'
